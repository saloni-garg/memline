[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memline"
version = "0.1.0"
description = "Python client for Memline: trustworthy, time-aware memory for AI applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["memline*"]
